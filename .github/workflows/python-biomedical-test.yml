name: Biomedical Solver CI

on:
  push:
    branches: [ main, develop, 'agent/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-numerics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Scientific Math Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run numerical verification suite
      run: python -m unittest discover -v

    - name: Run command-line smoke tests
      run: |
        python hemodynamic_solver.py
        python nervous_impulse_solver.py
        python hodgkin_huxley_solver.py
        python active_axon_solver.py
        python -m experiments.hh_1952_reference
        python -m experiments.active_axon_reference
        python -m experiments.export_solver_explorer --output /tmp/solver-explorer.html
